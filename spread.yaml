project: hindsight-operator

# Run with `charmcraft test` (craft backend: charmcraft packs the charm and
# passes it in CRAFT_ARTIFACT), or with spread directly on an LXD VM or a CI
# runner: `spread lxd-vm:` / `spread ci:` (set CRAFT_ARTIFACT to a packed charm).
backends:
  craft:
    type: craft
    systems:
      - ubuntu-24.04:

  lxd-vm:
    type: adhoc
    allocate: CPU=4 MEM=16 DISK=60 spread/.extension allocate lxd-vm
    discard: spread/.extension discard lxd-vm
    systems:
      - ubuntu-24.04:
          username: root
          password: "$(HOST: echo ${SPREAD_PASSWORD:-hindsight})"

  ci:
    type: adhoc
    allocate: spread/.extension allocate ci
    discard: spread/.extension discard ci
    systems:
      - ubuntu-24.04:
          username: root
          password: "$(HOST: echo ${SPREAD_PASSWORD:-hindsight})"

environment:
  SPREAD_PASSWORD: "$(HOST: echo ${SPREAD_PASSWORD:-hindsight})"
  CRAFT_ARTIFACT: "$(HOST: echo ${CRAFT_ARTIFACT})"

prepare: |
  # Juju needs the charm etc. to be owned by the running user.
  chown -R "${USER}" "${PROJECT_PATH}"

suites:
  spread/multitenancy/:
    summary: Per-key bank access (multi-tenancy) demonstrated against a live deployment
    environment:
      MODEL: hindsight-multitenancy
    prepare: |
      . "${PROJECT_PATH}/spread/lib/hindsight.sh"
      bootstrap_juju_on_microk8s
      deploy_hindsight_with_tenants
    restore: |
      juju destroy-model --no-prompt --force --destroy-storage --no-wait --timeout=60s \
        "${MODEL}" || true
    debug: |
      juju status -m "${MODEL}" --relations || true
      juju debug-log -m "${MODEL}" --replay --no-tail --limit 200 || true

exclude:
  - .git
  - .venv
  - "*.charm"

kill-timeout: 1h
